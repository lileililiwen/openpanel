# cargo-audit suppressions.
#
# Format (one entry per advisory):
# [[advisories]]
# id = "RUSTSEC-YYYY-NNNN"
# reason = "Why we accept this risk (false positive, no upgrade path, etc.)"
# patched = ["<version-range-with-fix>"]
#
# The advisory-db source URL:
#   https://rustsec.org/advisories/
#
# To regenerate the advisory-db, run:
#   cargo audit fetch

[advisory-db]
url = "https://github.com/rustsec/advisory-db"

# Add suppressions below as needed. Each must be reviewed.