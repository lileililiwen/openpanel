# Reviewed archived-governance manifest.
#
# Scope: archived OpenSpec deltas for the four governance capabilities
# (`agent-quality`, `quality`, `testing`, `architecture`). Every entry
# pins one requirement by content digest and scenario count and names the
# executable checker(s) that prove the requirement is still enforced.
#
# Enforced by `scripts/check-governance-contract.sh` (`make
# governance-contract`, wired into `make check`). The gate is read-only:
# it never rewrites this file.
#
# How to change a protected requirement (reviewed procedure):
#   1. Propose an OpenSpec change whose delta edits the live requirement
#      under `openspec/specs/<cap>/spec.md`.
#   2. Re-run `scripts/check-governance-contract.sh --report`.
#   3. Update the matching entry's `digest` and `scenarios` from the
#      report — in the same reviewed change, never as a drive-by edit.
#   4. Archive. The gate fails until steps 2-3 are done.
#
# How to protect a requirement that is currently unprotected:
#   1. Add positive + negative fixtures for the checker in
#      `scripts/test-gates.sh`, tagged `# checker: <id> positive` and
#      `# checker: <id> negative`.
#   2. Add the entry below (digest + scenarios from `--report`).
#   3. Remove the requirement from `unprotected-baseline.txt`
#      (regenerate it with `--write-baseline` after the entry lands).
#
# Available checker IDs are exactly those registered in
# `scripts/test-gates.sh`; the gate rejects an unknown (orphaned) ID.
version: 1

